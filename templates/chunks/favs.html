<div
  class="trio-tile"
  id="browse-our-favorites"
  style="--tile-color: var(--{{fav.color}}); background-image:  url('/images/fav-{{  fav.slug  }}.png'); "
>
  <div class="tile-header">
    <h3>Browse Our Favorites</h3>
  </div>

  <div class="carousel-nav">
    {% for i in bof_data %} {% if i.name == fav.name %}
    <span class="fake-fav-btn"> &nbsp; </span>
    {% else %}
    <button
      style="background: color-mix(in oklab, #fff, rgb(var(--{{i.color}})));"
      class="carousel-indicator"
      hx-get="/otd-fav?idx={{loop.index}}"
      hx-target="#browse-our-favorites"
      hx-swap="outerHTML"
    >
      &nbsp;
    </button>

    {% endif %} {% endfor %}
  </div>
  <section
    id="fav-{{fav.slug}}"
    class="fav"
    data-color="rgb(var(--{{fav.color}}))"
  >
    <p class="quote">{{fav.quote}}</p>
    <cite class="author">&mdash; {{fav.citation}}</cite>

    <a
      class="mtm-link"
      href="https://digital.newberry.org/time-machine/"
      target="_blank"
    >
      <h4>Midwest Time Machine</h4>
      <p>
        Explore the past through Newberry letters and diaries, transcribed by
        users like you.
      </p>
    </a>
  </section>
</div>
<style>
  .fav {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: end;
  }

  .quote {
    margin: 0;
  }

  .author {
    display: block;
    text-align: right;
  }

  .quote,
  .author {
    background-color: rgba(var(--tile-color), 0.7);
    padding: 0.5rem 1.33rem;
    backdrop-filter: blur(3px);
    color: var(--fg-color);
    text-align: right;
    overflow: hidden;
  }

  aside,
  aside img {
    height: 100%;
  }

  #browse-our-favorites {
    background-color: rgb(var(--tile-color));
    --glow-color: rgba(var(--granite), 0.5);
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    position: relative;

    flex: 1;
    display: flex;
    flex-direction: column;
    /* gap: 1rem; */
    transition: transform 0.5s ease-in-out;
    margin: 0;
    padding: 0;
  }

  .mtm-link {
    backdrop-filter: blur(3px);
    padding: 0.5rem 1.33rem 1.5rem 1.33rem;
    padding: 0.5rem 1.33rem;
    /* padding: 2rem; */
    display: flex;
    justify-content: center;
    align-items: center;
    /* flex-direction: column; */
    transition: var(--global-transition, 250ms);

    margin: 0;
    background-color: color-mix(
      in oklab,
      var(--tile-accent-color) 70%,
      transparent
    );
  }

  .mtm-link :is(p, h4) {
    flex: 1;
    text-decoration: none;
    color: var(--bg-color);
    margin: 0;
  }

  .mtm-link:hover {
    filter: brightness(1.33);
    --glo-color: rgb(var(--granite));
  }

  .mtm-link h4 {
    text-align: right;
    font-family: "hepta-slab", serif;
    font-weight: 700;
    padding: 1rem 0.5rem;
    font-size: 2rem;
    line-height: 1.6rem;
  }

  .tile-header {
    width: 100%;
  }

  .fav p,
  .fav cite {
    /* width: max(250px, 50%); */
  }
</style>
