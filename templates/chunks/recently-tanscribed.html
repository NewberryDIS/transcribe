<div class="trio-tile" id="recently-tanscribed"
    style="background-image: url('https://collections.newberry.org/IIIF3/Image/{{most_recent.image}}/full/300,/0/default.jpg');">

    <div class="tile-header">
        <h3>Recently Transcribed</h3>
    </div>
    <div id="rt-transc-container" class="transc-container">
        <pre class="transc-text">{{ most_recent.transcription }} </pre>
        <div class="transc-ack">
            <p>
                from <a href="/ms/{{ most_recent.ms_id }}/{{ most_recent.page_number }}" class="link-lines ack-link"
                    target="_blank">{{ most_recent.title
                    }}</a>. Transcribed
                by <b>{{ most_recent.transcription_user }}</b> on {{ most_recent.formatted_date }}</p>
        </div>
    </div>
    <div class="tile-footer">
    </div>
</div>

<style>
    .transc-container {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin: 10%;
        width: 80%;
        max-height: 80%;

        overflow-x: auto;
        overflow-y: hidden;
        background-color: var(--bg-color);
    }

    .transc-container pre {
        /* max-height: 70%; */

        white-space: pre-wrap;
        overflow-y: auto;
        text-overflow: ellipsis;
    }
</style>
